<script>
    // ===============================
// Clock + Greeting
// ===============================

function updateNovaOS() {

    const now = new Date();

    document.getElementById("clock").textContent =
        now.toLocaleDateString() + " " +
        now.toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
        });

    const hour = now.getHours();
    let greeting = "";

    if (hour >= 5 && hour < 12) {
        greeting = "🌅 Good Morning!";
    }
    else if (hour >= 12 && hour < 15) {
        greeting = "☀️ Good Midday!";
    }
    else if (hour >= 15 && hour < 18) {
        greeting = "🌞 Good Afternoon!";
    }
    else {
        greeting = "🌙 Good Night!";
    }

    document.getElementById("greeting").textContent = greeting;

}

updateNovaOS();
setInterval(updateNovaOS, 1000);


// ===============================
// Boot Screen
// ===============================

let progress = 0;

const messages = [
    "Starting Nova OS...",
    "Loading desktop...",
    "Checking system files...",
    "Preparing workspace...",
    "Welcome back User-kun!",
    "I-I mean User..."
];

let messageIndex = 0;

const boot = setInterval(function () {

    progress += 16;

    document.getElementById("progress").style.width = progress + "%";

    document.getElementById("loadingText").textContent =
        messages[Math.min(messageIndex, messages.length - 1)];

    messageIndex++;

    if (progress >= 100) {

        clearInterval(boot);

        setTimeout(function () {

            document.getElementById("welcome").style.opacity = "0";

            setTimeout(function () {

                document.getElementById("welcome").style.display = "none";

            }, 1000);

        }, 500);

    }

}, 700);


// ===============================
// Draggable Window
// ===============================

dragElement(document.getElementById("mydiv"));

function dragElement(element) {

    let pos1 = 0,
        pos2 = 0,
        pos3 = 0,
        pos4 = 0;

    const header = document.getElementById(element.id + "header");

    if (header) {
        header.onmousedown = dragMouseDown;
    } else {
        element.onmousedown = dragMouseDown;
    }

    function dragMouseDown(e) {

        e = e || window.event;

        e.preventDefault();

        pos3 = e.clientX;
        pos4 = e.clientY;

        document.onmouseup = closeDragElement;
        document.onmousemove = elementDrag;

    }

    function elementDrag(e) {

        e = e || window.event;

        e.preventDefault();

        pos1 = pos3 - e.clientX;
        pos2 = pos4 - e.clientY;

        pos3 = e.clientX;
        pos4 = e.clientY;

        element.style.top = (element.offsetTop - pos2) + "px";
        element.style.left = (element.offsetLeft - pos1) + "px";

    }

    function closeDragElement() {

        document.onmouseup = null;
        document.onmousemove = null;

    }

}


// ===============================
// Window Controls
// ===============================

const myWindow = document.getElementById("mydiv");
const minimizeBtn = document.getElementById("minimizeBtn");
const closeBtn = document.getElementById("closeBtn");
const openBtn = document.getElementById("openBtn");

minimizeBtn.onclick = function () {

    myWindow.style.visibility = "hidden";
    openBtn.style.display = "inline-block";

};

closeBtn.onclick = function () {

    myWindow.style.display = "none";
    openBtn.style.display = "inline-block";

};

openBtn.onclick = function () {

    myWindow.style.display = "block";
    myWindow.style.visibility = "visible";
    openBtn.style.display = "none";

};


// ===============================
// Console Messages
// ===============================

console.log("🚀 Nova OS started successfully.");
console.log("System Status: Online");

</script>
