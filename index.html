<script>


// ===============================
// CLOCK + GREETING
// ===============================


function updateNovaOS(){

const now = new Date();


document.getElementById("clock").textContent =
now.toLocaleDateString() + " " +
now.toLocaleTimeString([],{
hour:"2-digit",
minute:"2-digit",
second:"2-digit"
});


const hour = now.getHours();

let greeting;


if(hour >= 5 && hour < 12){

greeting="🌅 Good Morning!";

}

else if(hour >= 12 && hour < 15){

greeting="☀️ Good Midday!";

}

else if(hour >= 15 && hour < 18){

greeting="🌞 Good Afternoon!";

}

else{

greeting="🌙 Good Night!";

}


document.getElementById("greeting").textContent=greeting;


}


updateNovaOS();

setInterval(updateNovaOS,1000);



// ===============================
// BOOT SYSTEM
// ===============================


let progress=0;


const messages=[

"Starting Waguri OS...",
"Loading Waguri Desktop...",
"Checking Waguri system files...",
"Preparing Waguri workspace...",
"Welcome back Kaoruko Waguri! :) ",



];


let messageIndex=0;


const boot=setInterval(function(){


progress+=20;


document.getElementById("progress").style.width=
progress+"%";


document.getElementById("loadingText").textContent=
messages[Math.min(messageIndex,messages.length-1)];


messageIndex++;


if(progress>=100){


clearInterval(boot);


setTimeout(function(){


document.getElementById("welcome").style.opacity="0";


setTimeout(function(){


document.getElementById("welcome").style.display="none";


},1000);


},500);


}


},700);



// ===============================
// DRAG WINDOW
// ===============================


dragElement(document.getElementById("mydiv"));



function dragElement(element){


let pos1=0,
pos2=0,
pos3=0,
pos4=0;


const header=document.getElementById(element.id+"header");


header.onmousedown=dragMouseDown;



function dragMouseDown(e){


e.preventDefault();


pos3=e.clientX;
pos4=e.clientY;


document.onmouseup=closeDragElement;

document.onmousemove=elementDrag;


}



function elementDrag(e){


e.preventDefault();


pos1=pos3-e.clientX;

pos2=pos4-e.clientY;


pos3=e.clientX;

pos4=e.clientY;


let newTop=element.offsetTop-pos2;

let newLeft=element.offsetLeft-pos1;



newTop=Math.max(
0,
Math.min(
window.innerHeight-element.offsetHeight,
newTop
)
);


newLeft=Math.max(
0,
Math.min(
window.innerWidth-element.offsetWidth,
newLeft
)
);



element.style.top=newTop+"px";

element.style.left=newLeft+"px";


}



function closeDragElement(){


document.onmouseup=null;

document.onmousemove=null;


}


}



// ===============================
// WINDOW CONTROLS
// ===============================


const myWindow=document.getElementById("mydiv");

const minimizeBtn=document.getElementById("minimizeBtn");

const closeBtn=document.getElementById("closeBtn");

const openBtn=document.getElementById("openBtn");



function openNova(){


myWindow.style.display="block";

myWindow.style.visibility="visible";

openBtn.style.display="none";


}



minimizeBtn.onclick=function(){


myWindow.style.visibility="hidden";

openBtn.style.display="inline-block";


};



closeBtn.onclick=function(){


myWindow.style.display="none";

openBtn.style.display="inline-block";


};



openBtn.onclick=openNova;



console.log("🚀 Waguri OS started successfully.");

console.log("System Status: Online");


</script>
